<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Fundo -->
  <rect width="64" height="64" rx="12" fill="#1a0a00"/>
  <!-- Bandeirinha triangular festa junina -->
  <polygon points="8,12 56,12 32,48" fill="#e74c3c"/>
  <polygon points="8,12 32,12 20,48" fill="#f1c40f"/>
  <polygon points="32,12 56,12 44,48" fill="#2ecc71"/>
  <!-- Estrelinhas -->
  <circle cx="16" cy="8" r="2" fill="#f1c40f"/>
  <circle cx="32" cy="6" r="2" fill="#f1c40f"/>
  <circle cx="48" cy="8" r="2" fill="#f1c40f"/>
  <!-- Cordinha -->
  <line x1="4" y1="12" x2="60" y2="12" stroke="#f8d56b" stroke-width="2" stroke-linecap="round"/>
  <!-- Milho abaixo -->
  <ellipse cx="32" cy="56" rx="8" ry="5" fill="#f4d03f"/>
  <ellipse cx="32" cy="54" rx="6" ry="4" fill="#f39c12"/>
</svg>
